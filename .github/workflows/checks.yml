name: Quality gates

# Runs on every PR and on pushes to main. These are pre-deploy checks: the
# site deploys to the Cloudflare Worker `latribu` with `wrangler deploy`; this
# catches broken pages, Worker regressions and leaked secrets before they ship.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  links:
    name: Broken-link check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check links in HTML
        uses: lycheeverse/lychee-action@v2
        with:
          # Only check the served HTML pages (public/). whatsapp-qr.webp is a pending asset
          # (USER_TASKS/action-report.html, section 5); the pages hide the image until it exists.
          args: --no-progress --accept 200,206,429 --exclude 'whatsapp-qr\.webp$' './public/*.html'
          fail: true

  htmlhint:
    name: HTML lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run HTMLHint
        run: npx --yes htmlhint "public/*.html"

  worker:
    name: Worker tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan for committed secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
